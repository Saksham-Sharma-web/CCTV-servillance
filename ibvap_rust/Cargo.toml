[package]
name = "ibvap_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
pyo3 = { version = "0.23", features = ["auto-initialize"] }
slint = "1.17.1"
slint-build = "1.17.1"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4.45"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11.0"
axum = "0.7.5"
tokio-util = "0.7"
local-ip-address = "0.6.3"
[build-dependencies]
slint-build = "1.17.1"

